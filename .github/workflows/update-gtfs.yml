name: Update LPP timetable

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official LPP GTFS
        run: curl --fail --location --retry 3 https://data.lpp.si/api/gtfs/feed.zip --output /tmp/lpp-feed.zip
      - name: Build browser datasets
        run: |
          node scripts/build-lpp-data.mjs /tmp/lpp-feed.zip
          node scripts/build-lpp-routing.mjs /tmp/lpp-feed.zip
          node scripts/build-lpp-schedule.mjs /tmp/lpp-feed.zip
      - name: Commit a changed timetable
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update LPP GTFS timetable"
          git push
